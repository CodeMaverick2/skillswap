name: API image

on:
  workflow_dispatch:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/api-image.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/api-image.yml'

concurrency:
  group: api-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        working-directory: backend
        run: docker build -t skillswap-api:ci .

      - name: Smoke test image
        run: |
          docker network create skillswap-ci || true
          docker run -d --name mongo-ci --network skillswap-ci mongo:7
          for i in $(seq 1 30); do
            docker exec mongo-ci mongosh --quiet --eval 'db.runCommand({ ping: 1 })' && break
            sleep 2
          done
          docker run -d --name api-ci --network skillswap-ci \
            -e NODE_ENV=production \
            -e PORT=5000 \
            -e MONGODB_URI=mongodb://mongo-ci:27017/skillswap_ci \
            -e JWT_SECRET=ci-image-smoke-secret-not-for-prod \
            -e JWT_EXPIRES_IN=15m \
            -e REFRESH_TOKEN_EXPIRES_IN=7d \
            -e BCRYPT_ROUNDS=4 \
            -p 5000:5000 \
            skillswap-api:ci
          for i in $(seq 1 30); do
            HEALTH=$(curl -sf http://localhost:5000/api/health || true)
            if echo "$HEALTH" | grep -q '"status":"ok"' && echo "$HEALTH" | grep -q '"db":"connected"'; then
              echo "$HEALTH"
              exit 0
            fi
            sleep 2
          done
          docker logs api-ci || true
          exit 1

      - name: Cleanup
        if: always()
        run: |
          docker rm -f api-ci mongo-ci || true
          docker network rm skillswap-ci || true
