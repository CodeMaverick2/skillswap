# Railway config for SkillSwap API (set Root Directory = backend in the dashboard,
# or deploy from this folder with: railway up)

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
